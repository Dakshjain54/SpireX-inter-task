<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Mart</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <div class="container">
      <a href="#home" class="logo">Shopping Mart</a>
      <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#cart" class="cart-link">Cart <span id="cart-count">0</span></a>
        <button id="theme-toggle" class="theme-btn" title="Toggle Light/Dark Theme">🌙</button>
      </nav>
    </div>
  </header>

  <section id="home" class="hero">
    <div class="container">
      <h1>Welcome to Shopping Mart</h1>
      <p>Find everyday products at simple and affordable prices.</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </section>

  <section id="products" class="container">
    <div class="products-header">
      <h2>Products</h2>
      <input type="text" id="search-input" placeholder="Search products...">
    </div>

    <div id="product-grid" class="product-grid"></div>
    <p id="no-products" class="no-products" style="display: none;">No products found.</p>
  </section>

  <section id="cart" class="container">
    <h2>Shopping Cart</h2>
    <div class="cart-box">
      <div id="cart-items" class="cart-items"></div>

      <div class="cart-summary">
        <h3>Summary</h3>
        <p>Total: <strong>₹<span id="cart-total">0</span></strong></p>
        <button id="place-order-btn" class="btn btn-order">Place Order</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast">Added to cart!</div>

  <div id="order-modal" class="modal">
    <div class="modal-content">
      <h3>Order placed successfully!</h3>
      <p>Thank you for shopping with us.</p>
      <button id="close-modal" class="btn">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
