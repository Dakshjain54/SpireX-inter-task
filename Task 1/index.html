<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Modern Premium Personal Portfolio Card - Glassmorphism UI with interactive animations, tilt effects, and custom background particles.">
    <title>Daksh jain | Personal Portfolio Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Interactive Background Canvas for Particles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Ambient Glowing Gradient Blobs -->
    <div class="ambient-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Mouse Cursor Glow Spotlight -->
    <div class="cursor-glow" id="cursor-glow"></div>

    <!-- Main Container -->
    <main class="container">
        <!-- Glassmorphism Portfolio Card -->
        <article class="portfolio-card" id="portfolio-card" aria-label="Developer Portfolio Card">
            <!-- Glass Overlay Highlight -->
            <div class="card-glass-shine"></div>

            <!-- Header / Profile Section -->
            <div class="card-header">
                <div class="profile-img-container">
                    <div class="animated-border"></div>
                    <img src="avatar.png" alt="Daksh jain - Frontend Developer & AI Enthusiast" class="profile-img">
                    <span class="status-badge" title="Available for hire">
                        <span class="status-dot"></span>
                        <span class="status-ping"></span>
                    </span>
                </div>
            </div>

            <!-- Info Section -->
            <div class="card-body">
                <h1 class="user-name">Daksh jain</h1>

                <!-- Typing Animated Profession Text -->
                <div class="profession-container">
                    <span class="profession-text" id="typing-text"></span>
                    <span class="typing-cursor">|</span>
                </div>

                <!-- Short Bio -->
                <p class="user-bio">
                    Crafting futuristic, high-performance web experiences with sleek UI/UX aesthetics & cutting-edge AI
                    integrations.
                </p>

                <!-- Quick Stats Pills -->
                <div class="stats-grid">
                    <div class="stat-pill">
                        <i class="fa-solid fa-code"></i>
                        <span>2+ Yrs Exp</span>
                    </div>
                    <div class="stat-pill">
                        <div class="stat-icon"><i class="fa-solid fa-diagram-project"></i></div>
                        <span>10+ Projects</span>
                    </div>
                    <div class="stat-pill">
                        <i class="fa-solid fa-award"></i>
                        <span>Top Rated</span>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="social-links">
                    <a href="https://github.com/Dakshjain54" target="_blank" rel="noopener noreferrer"
                        class="social-btn" aria-label="GitHub Profile" data-tooltip="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/daksh-jain-b124ba30b/" target="_blank"
                        rel="noopener noreferrer" class="social-btn" aria-label="LinkedIn Profile"
                        data-tooltip="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn"
                        aria-label="Instagram Profile" data-tooltip="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="mailto:daksh225j@gmail.com" class="social-btn" id="email-btn" aria-label="Send Email"
                        data-tooltip="Email Me">
                        <i class="fa-regular fa-envelope"></i>
                    </a>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="btn btn-primary ripple-effect" id="download-cv-btn">
                        <i class="fa-solid fa-download"></i>
                        <span>Download Resume</span>
                    </button>
                    <button class="btn btn-secondary ripple-effect" id="contact-btn">
                        <i class="fa-paper-plane fa-solid"></i>
                        <span>Contact Me</span>
                    </button>
                </div>
            </div>
        </article>
    </main>

    <!-- Toast Notification Modal -->
    <div class="toast-notification" id="toast">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span class="toast-message" id="toast-message">Resume download initiated!</span>
    </div>

    <!-- Contact Modal -->
    <div class="modal-overlay" id="contact-modal" aria-hidden="true">
        <div class="modal-card">
            <button class="modal-close" id="modal-close-btn" aria-label="Close modal">&times;</button>
            <div class="modal-header">
                <h3>Get In Touch</h3>
                <p>Send a message or reach out directly.</p>
            </div>
            <form class="contact-form" id="contact-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <input type="text" placeholder="Your Name" required class="form-input">
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Your Email" required class="form-input">
                </div>
                <div class="form-group">
                    <textarea placeholder="Your Message..." rows="3" required class="form-input"></textarea>
                </div>
                <button type="submit" class="btn btn-primary modal-send-btn ripple-effect">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
