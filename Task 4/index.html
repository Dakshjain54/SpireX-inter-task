<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Authentication - Login & Sign Up</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Ambient Animated Background Elements -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Main Container -->
  <main class="auth-container">
    <div class="auth-card">

      <!-- Card Header -->
      <div class="auth-header">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <h1 id="form-title">Welcome Back</h1>
        <p id="form-subtitle">Please enter your credentials to access your account.</p>
      </div>

      <!-- Form Views Container -->
      <div class="forms-wrapper">

        <!-- 1. LOGIN FORM -->
        <form id="login-form" class="auth-form active" novalidate>

          <!-- Email Input -->
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
              <input type="email" id="login-email" name="email" placeholder="name@example.com" autocomplete="email"
                required>
              <span class="status-icon"></span>
            </div>
            <span class="error-message" id="login-email-error"></span>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="login-password" name="password" placeholder="Enter password"
                autocomplete="current-password" required>
              <button type="button" class="toggle-password" data-target="login-password"
                aria-label="Toggle password visibility">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <span class="error-message" id="login-password-error"></span>
          </div>

          <!-- Options Row: Remember Me & Forgot Password -->
          <div class="form-options">
            <label class="custom-checkbox">
              <input type="checkbox" id="remember-me" name="remember">
              <span class="checkmark"></span>
              <span class="label-text">Remember Me</span>
            </label>
            <a href="#forgot" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Login Submit Button -->
          <button type="submit" id="login-btn" class="submit-btn" disabled>
            <span>Login</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </form>

        <!-- 2. SIGNUP FORM -->
        <form id="signup-form" class="auth-form hidden" novalidate>

          <!-- Full Name Input -->
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input type="text" id="signup-name" name="fullname" placeholder="Daksh jain" autocomplete="name" required>
              <span class="status-icon"></span>
            </div>
            <span class="error-message" id="signup-name-error"></span>
          </div>

          <!-- Email Address Input -->
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
              <input type="email" id="signup-email" name="email" placeholder="name@example.com" autocomplete="email"
                required>
              <span class="status-icon"></span>
            </div>
            <span class="error-message" id="signup-email-error"></span>
          </div>

          <!-- Phone Number Input -->
          <div class="form-group">
            <label for="signup-phone">Phone Number</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
              </span>
              <input type="tel" id="signup-phone" name="phone" placeholder="1234567890" autocomplete="tel" required>
              <span class="status-icon"></span>
            </div>
            <span class="error-message" id="signup-phone-error"></span>
          </div>

          <!-- Password Input with Strength Indicator -->
          <div class="form-group">
            <label for="signup-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="signup-password" name="password" placeholder="At least 6 characters"
                autocomplete="new-password" required>
              <button type="button" class="toggle-password" data-target="signup-password"
                aria-label="Toggle password visibility">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>

            <!-- Password Strength Bar -->
            <div class="strength-meter-container" id="strength-container">
              <div class="strength-bar-bg">
                <div class="strength-bar-fill" id="strength-bar"></div>
              </div>
              <span class="strength-label" id="strength-label">Password strength</span>
            </div>

            <span class="error-message" id="signup-password-error"></span>
          </div>

          <!-- Confirm Password Input -->
          <div class="form-group">
            <label for="signup-confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                  <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
              </span>
              <input type="password" id="signup-confirm-password" name="confirmPassword" placeholder="Re-enter password"
                autocomplete="new-password" required>
              <button type="button" class="toggle-password" data-target="signup-confirm-password"
                aria-label="Toggle password visibility">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <span class="error-message" id="signup-confirm-password-error"></span>
          </div>

          <!-- Signup Submit Button -->
          <button type="submit" id="signup-btn" class="submit-btn" disabled>
            <span>Create Account</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </form>

      </div>

      <!-- Card Footer - Form Switch Link -->
      <div class="auth-footer">
        <p id="switch-text">
          Don't have an account?
          <button type="button" id="switch-btn" class="switch-link">Sign Up</button>
        </p>
      </div>

    </div>
  </main>

  <!-- Success Modal Popup -->
  <div class="modal-overlay hidden" id="success-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-icon-container">
        <svg class="checkmark-svg" width="60" height="60" viewBox="0 0 52 52">
          <circle class="checkmark-circle" cx="26" cy="26" r="24" fill="none" />
          <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
      </div>
      <h2 id="modal-title">Success!</h2>
      <p id="modal-message">You have successfully logged in.</p>
      <button type="button" id="modal-close-btn" class="modal-btn">Continue</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
